<div class="shell">
  <nav class="shell-nav" aria-label="Views">
    <a routerLink="/remotes" routerLinkActive="active">Remotes &amp; Exposes</a>
    <a routerLink="/shared" routerLinkActive="active">Shared Dependencies</a>
    <a routerLink="/import-map" routerLinkActive="active">Import Map</a>
    <button
      type="button"
      class="nf-button shell-export"
      (click)="exporter.exportCurrent()"
      [disabled]="!exporter.canExport()"
      title="Download the current snapshot as a JSON file"
    >
      Export JSON
    </button>
  </nav>
  <main class="shell-content">
    <router-outlet />
  </main>
</div>
