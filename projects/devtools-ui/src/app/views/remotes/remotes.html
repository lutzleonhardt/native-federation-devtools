<section class="view remotes-view">
  <!-- The capture-boundary claim lives in the heading tooltip while the
       list has rows (screenshot review); the empty state keeps it visible
       — load-bearing there. -->
  <h1 class="tip" [title]="boundaryNote">Remotes</h1>
  @if (vm(); as vm) {
    @if (vm.emptyNote) {
      <p class="view-observation">{{ vm.emptyNote }}</p>
      <p class="view-observation boundary-note">{{ vm.boundaryNote }}</p>
    } @else {
      <nf-master-detail class="remotes-split">
        <div nfMaster class="remotes-master">
          <nf-tree-table
            label="remotes"
            [rows]="vm.rows"
            [selectedId]="selectedName()"
            (selectRow)="onSelect($event)"
          >
            <ng-template let-payload>
              <nf-participant-chip [name]="payload.name" [host]="payload.host" />
              @if (payload.unresolved; as unresolved) {
                <span class="row-warn" [title]="unresolved.note">⚠</span>
              }
              <span class="remote-summary">{{ payload.summary }}</span>
            </ng-template>
          </nf-tree-table>
        </div>

        <div nfDetail class="remote-detail-pane">
          <nf-remote-detail [detail]="vm.detail" />
        </div>
      </nf-master-detail>
    }
  } @else {
    <p class="view-observation">no captured snapshot to render</p>
  }
</section>
